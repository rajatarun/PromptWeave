[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptweave"
version = "0.1.0"
description = "Deterministic multi-family prompt compiler with SHA-256 content fingerprinting."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "PromptWeave contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
promptweave = "promptweave.cli:main"

[project.urls]
Homepage = "https://github.com/rajatarun/PromptWeave"
Repository = "https://github.com/rajatarun/PromptWeave"
Documentation = "https://github.com/rajatarun/PromptWeave#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptweave*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
