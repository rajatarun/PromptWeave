[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptweave"
version = "0.0.0"
description = "Early scaffold for composing and normalizing prompts across models and agent runtimes (not yet implemented on main)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "PromptWeave contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/rajatarun/PromptWeave"
Repository = "https://github.com/rajatarun/PromptWeave"
Documentation = "https://github.com/rajatarun/PromptWeave#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptweave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
