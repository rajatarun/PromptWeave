[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "promptweave"
version = "0.1.0"
description = "MCP-compatible prompt normalization service for multi-model agentic systems"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "jinja2>=3.1.4",
    "fastmcp>=2.0.0",
    "mangum>=0.17.0",
    "pydantic>=2.0.0",
    "boto3>=1.34.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["promptweave*"]
