AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PromptWeave — MCP-compatible prompt normalization service

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - x86_64

Parameters:
  IntentModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID for the intent extractor

Resources:
  TemplateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PromptWeaveFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      CodeUri: .
      Description: PromptWeave MCP tool — normalize_prompt
      Environment:
        Variables:
          TEMPLATE_STORAGE: s3
          TEMPLATE_BUCKET: !Ref TemplateBucket
          INTENT_MODEL_ID: !Ref IntentModelId
          POWERTOOLS_SERVICE_NAME: promptweave
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
        - S3ReadPolicy:
            BucketName: !Ref TemplateBucket
      Events:
        McpApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL for the PromptWeave MCP server
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp"

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt PromptWeaveFunction.Arn

  TemplateBucketName:
    Description: S3 bucket for versioned Jinja2 prompt templates
    Value: !Ref TemplateBucket
